<script>/* 11-16 16:12 대표님 「지금 나 모바일 기준으로 보여 주는 거 맞지?」: PC(넓은 화면)에서도 폰 화면(가로 430)을 그대로 — 같은 페이지를 폰 크기 틀(iframe)에 넣고 화면 높이에 맞춰 통째로 키움. 틀 안은 폰과 똑같은 배치 · 규칙(가로 430 미디어 규칙 그대로) */
(function () { var q = location.search; if (/[?&](inner|trailer)=1/.test(q) || window.top !== window.self && /[?&]inner=1/.test(q)) return; if (window.innerWidth < 640) return;
  var W = 430, s = Math.min(window.innerHeight / 900, (window.innerWidth * 0.96) / W), H = Math.round(window.innerHeight / s);
  window.stop && window.stop(); window.__FRAMED = 1;
  var src = location.pathname + (q ? q + '&' : '?') + 'inner=1' + location.hash;
  document.documentElement.innerHTML = '<head><meta charset="utf-8"><title>지배자 키우기</title><style>html,body{margin:0;height:100%;background:radial-gradient(ellipse at center,#1a0b2c 0%,#05010a 70%);overflow:hidden}#pf{position:absolute;left:50%;top:0;width:' + W + 'px;height:' + H + 'px;border:0;transform-origin:top center;transform:translateX(-50%) scale(' + s + ');box-shadow:0 0 60px #000}</style></head><body><iframe id="pf" src="' + src + '" allow="autoplay; fullscreen; vibrate" title="지배자 키우기"></iframe></body>';
  window.addEventListener('resize', function () { var f = document.getElementById('pf'); if (!f) return; var s2 = Math.min(window.innerHeight / 900, (window.innerWidth * 0.96) / W); f.style.height = Math.round(window.innerHeight / s2) + 'px'; f.style.transform = 'translateX(-50%) scale(' + s2 + ')'; });
})();</script>

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>던전 히어로</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden}
#w{height:100%;display:flex;align-items:center;justify-content:center}
#p{height:min(96vh,1100px);aspect-ratio:412/915;border:7px solid #23222b;border-radius:34px;overflow:hidden;box-shadow:0 0 0 2px #3a3946,0 20px 60px rgba(0,0,0,.7);background:#000}
iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><div id="w"><div id="p"><iframe src="index.html" allow="autoplay; fullscreen" title="던전 히어로"></iframe></div></div>
<script>addEventListener('load',()=>{const f=document.querySelector('iframe');f.focus();addEventListener('click',()=>f.focus());});</script></body></html>
